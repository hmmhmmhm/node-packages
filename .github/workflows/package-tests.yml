name: Package Tests

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/package-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/package-tests.yml'

permissions:
  contents: read

jobs:
  select-runner:
    uses: ./.github/workflows/select-local-runner.yml
    with:
      cloud-runner: ubuntu-latest
    secrets:
      status-token: ${{ secrets.LOCAL_RUNNER_STATUS_TOKEN }}

  test:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    
    strategy:
      matrix:
        node-version: [20]
        package: [biggest, curse-script, edge-crypto, gauss-spiral, mugunghwa, patternly, pseudo-shuffle]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests for ${{ matrix.package }}
        run: pnpm --filter ${{ matrix.package }} test
